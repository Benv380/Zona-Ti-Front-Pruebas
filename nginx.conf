server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ambos prefijos van al gateway (unico punto de entrada al backend, ver
    # gateway-service/GatewayRoutesConfig.java) -- antes iban directo a
    # "backend"/"auth-service" cuando compra-service todavia mezclaba
    # Compra Agil y Licitacion en un solo proceso; ahora que estan
    # separados (compra-service/licitacion-service/auth-service) hace falta
    # un solo lugar que sepa a cual de los 3 mandar cada request, y ese es
    # el gateway. "gateway" se resuelve por DNS interno de Docker Compose
    # (ver docker-compose.yml en la raiz del proyecto).
    location ^~ /compra/ {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /auth/ {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Los archivos dentro de /assets/ vienen con hash en el nombre (los
    # genera Vite, ej. index-Nvl6Clz7.js) -- si cambia el contenido, cambia
    # el nombre, asi que se pueden cachear agresivo sin riesgo.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html en cambio SIEMPRE tiene el mismo nombre -- sin esto el
    # navegador lo puede cachear igual que cualquier archivo estatico, y
    # entonces un rebuild del front (nuevo CSS/JS) no se ve reflejado
    # hasta que el usuario fuerza un refresh a mano (Ctrl+Shift+R). Con
    # esto, el navegador siempre revalida contra el servidor antes de
    # usarlo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
